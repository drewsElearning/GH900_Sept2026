<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">First push workflow</title>
<desc id="desc">A local repository moves through add and commit to a GitHub remote.</desc>
<rect width="760" height="420" rx="14" fill="#152d3d"/>
<text x="52" y="63" fill="#91e3a7" font-family="monospace" font-size="12">FIRST PUSH / LOCAL TO REMOTE</text>
<rect x="52" y="110" width="184" height="180" rx="9" fill="#f7f9fb"/>
<text x="76" y="147" fill="#182230" font-family="sans-serif" font-size="17" font-weight="700">Your computer</text>
<text x="76" y="180" fill="#1f883d" font-family="monospace" font-size="13">git add .</text>
<text x="76" y="214" fill="#1f883d" font-family="monospace" font-size="13">git commit</text>
<text x="76" y="248" fill="#667384" font-family="monospace" font-size="12">local history</text>
<rect x="524" y="110" width="184" height="180" rx="9" fill="#204153" stroke="#517382"/>
<text x="548" y="147" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700">GitHub</text>
<text x="548" y="180" fill="#91e3a7" font-family="monospace" font-size="13">git remote add</text>
<text x="548" y="214" fill="#91e3a7" font-family="monospace" font-size="13">git push -u</text>
<text x="548" y="248" fill="#bdcdd1" font-family="monospace" font-size="12">shared remote</text>
<path d="M258 200h238" stroke="#91e3a7" stroke-width="3" stroke-dasharray="9 8"/><path d="m476 186 24 14-24 14" fill="none" stroke="#91e3a7" stroke-width="3"/>
<text x="380" y="176" text-anchor="middle" fill="#bdcdd1" font-family="monospace" font-size="11">publish</text>
<circle cx="380" cy="342" r="23" fill="#91e3a7"/><text x="380" y="349" text-anchor="middle" fill="#152d3d" font-family="sans-serif" font-size="20" font-weight="700">✓</text>
<text x="420" y="347" fill="#fff" font-family="sans-serif" font-size="14">Now the project can collaborate.</text>
</svg>
